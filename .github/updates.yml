name: Scheduled Docker Update

on:
  push:
    branches: [ main ] 
  schedule:
    - cron: '0 20 * * 4'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 192.168.0.161
          username: deployer
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Make sure this path is correct!
            cd /opt/compose
            
            # Optional: If your compose files are in a git repo, pull the latest changes
            # git pull
            
            # Update containers
            docker compose pull
            docker compose up -d --remove-orphans
            
            # Clean up old images to save disk space
            docker image prune -f
